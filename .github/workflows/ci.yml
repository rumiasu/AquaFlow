name: CI

# 本 workflow 必须位于**仓库根** `.github/workflows/` 才会被 GitHub Actions 读取。
# （2026-09-13 之前它位于 AquaFlow-backend/.github/workflows/，从未被执行过。）
#
# 门禁内容：真实 MySQL + 真 HTTP 的集成测试、小程序静态扫描、敏感信息扫描。
# 三者任一失败即红，目的是把「改完忘了跑测试」挡住，而不是替代本地开发。

on:
  # 触发面缺口（2026-09-30 修 F-04）：原来 push 只覆盖 main/master/dev、pull_request 只覆盖 main/master，
  # 于是**功能分支的推送**与**面向 dev 的 PR** 完全不跑 CI —— 而 `pull_request.branches` 过滤的是
  # **base（目标）分支**，不是来源分支，所以 `dev` 当目标时 17 道门禁在最需要反馈的开发期是关闭的。
  # 现在：push 覆盖所有分支；pull_request 不过滤目标分支（等同 `["**"]`）+ 覆盖 opened/synchronize/reopened
  # 等默认活动类型。代价只是多跑几次 CI，收益是"改完忘了跑测试"在 PR 阶段就被挡住。
  push:
    # `**` 覆盖所有分支（含 `feature/x` 这类带斜杠的名字）。`main`/`master` 本就包含在内，
    # 列出来只是为了让人一眼看出"主干也跑"，不构成额外含义。
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        # 与本机开发库同版本（MySQL 8.4.8）；schema.sql 即从 8.4 导出，
        # 用 8.0 会引入「8.4 能建、8.0 建不出」的隐性版本漂移。
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aquaflow_test
          TZ: Asia/Shanghai
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # 库名必须含 test：AbstractIntegrationTest 每用例前会断言当前库名含 test 再 TRUNCATE 全表，
      # 用 aquaflow 会被护栏直接拒绝（这是防误清真实库的最后一道防线）。
      TEST_DB_URL: "jdbc:mysql://127.0.0.1:3306/aquaflow_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      DB_URL: "jdbc:mysql://127.0.0.1:3306/aquaflow_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: root
      DB_PASSWORD: root
      # RequiredConfigChecker 在启动期强制校验以下三项，缺失或 JWT_SECRET 短于 32 位即拒绝启动。
      # 这里是只指向临时容器的丢弃值，不指向任何真实环境。
      # 注意：故意写成**不带引号**的裸标量——scripts/scan-secrets.sh 的规则是
      # 「键名 + 冒号 + 带引号的 12 位以上值」，带引号会被自己的密钥扫描判为硬编码密钥而拦红 CI。
      JWT_SECRET: ci-placeholder-jwt-secret-not-used-anywhere-min-32-chars
      WX_APP_ID: ci-dummy-appid
      WX_APP_SECRET: ci-dummy
      DEV_LOGIN_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 「克隆得到吗」门禁（2026-09-28 新增，**故意放在最前面**：它最便宜，且失败原因最直白）。
      #
      # 为什么必须有：`application-prod.yml` 一度同时被 .gitignore 忽略、又没被 git 跟踪。
      # 本机所有门禁全绿（文件在工作区里就在，构建也从工作树读），但**新克隆的仓库没有它** ⇒
      # 下面那条「生产配置覆盖门禁」会在 checkout 之后立刻 exit 1（找不到文件），CI 必红；
      # 真部署时 prod profile 还会静默退化成 application.yml 的默认值（CORS 变 localhost、员工端 appid 变空）。
      # ⇒ 判据：**"文件存在"不等于"别人 clone 得到"**。本步按 git 视角查：
      #    被忽略的必需件 = 失败；未跟踪的 = 警告（提交时别忘 git add）。
      - name: 「克隆得到吗」门禁（CI/发布依赖件是否入库）
        run: node scripts/check-tracked-inputs.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # 项目未启用 Flyway，schema.sql 是权威基线，必须显式建表，否则集成测试上下文加载即失败。
      - name: 初始化测试库（schema.sql 为权威基线）
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            echo "waiting for mysql... ($i)"; sleep 2
          done
          mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS aquaflow_test; CREATE DATABASE aquaflow_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          mysql -h 127.0.0.1 -uroot -proot aquaflow_test < AquaFlow-backend/sql/schema.sql
          echo "表数：$(mysql -h 127.0.0.1 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='aquaflow_test';")"

      - name: 后端集成测试（真实 MySQL + 真 HTTP）
        working-directory: AquaFlow-backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --console=plain

      # 八个脚本均有真实退出码（0 通过 / 1 有致命问题），失败会拦红：
      #   audit_wxml_handlers.py：wxml 绑定的事件处理函数是否真实存在（缺失=点击静默无反应），自动扫两端
      #   page_reach_audit.py  ：app.json 注册页缺失 .js、跳转到未注册页；需传端名，故两端各跑一次
      #   static_audit_user.py ：require 相对层级错、wxml 里调全局对象/Page 方法；同上
      #   audit_comments.py    ：悬空 javadoc —— 无归属的注释会误导读代码的人（已有三次真实事故，见 AGENTS.md §8 第 14 条），自动扫两端
      #   audit_js_syntax.py   ：js 解析期错误（重复 const 声明/少括号）会让整个模块加载失败，其余脚本都不解析 js
      #   audit_wxss_selectors.py：同一个元素上的两个类被写成 `.A .B`（子孙选择器）⇒ 整块样式静默失效。
      #     2026-09-26 实测：首次资产告知弹窗的卡片被留在 translateY(100%) 屏幕外，只剩遮罩，客户首单被挡死，
      #     而上面五个门禁全绿（都不解析 wxss）。
      - name: 小程序静态扫描（两端）
        run: |
          python3 audit_wxml_handlers.py
          python3 page_reach_audit.py miniapp-user
          python3 page_reach_audit.py miniapp-delivery
          python3 static_audit_user.py miniapp-user
          python3 static_audit_user.py miniapp-delivery
          python3 audit_comments.py
          python3 audit_js_syntax.py
          python3 audit_wxss_selectors.py

      # 小程序文本体检（2026-09-30 新增，合成 F-33 + F-13 的一半）：按扩展名**全仓遍历**两端小程序的
      # `.js/.wxml/.wxss/.json`，查 ① UTF-8 BOM（带 BOM 的 `.wxss` 让开发者工具报「编译 .wxss 文件错误」
      # 且**不指名文件**，而当时四个门禁全绿，见 skill §8.28）② `<text>` 内出现开发词
      # （`接口/后端/前端/服务端/落库/端点/字段/部署/重新构建`，AGENTS §6 的文案禁令；注释里随便写，
      # 脚本先整体剥掉 `<!-- -->` 再匹配，只认会渲染给用户的那部分）。
      # ⚠️ 它取代了 `scripts/debug/__check-no-bom.js` 这个**没有任何入口**的孤儿脚本（`check-gate-parity.js`
      #    的 GATE_PATTERN 认不出 `__` 前缀；旧脚本还是硬编码 16 文件清单、CRLF 只打印不判红）。
      - name: 小程序文本体检（BOM / 面向用户文案的开发词）
        run: node scripts/check-miniapp-text.js

      # 生产配置覆盖门禁（2026-09-27 新增）。
      # 为什么需要它：「生产缺哪个变量会拒启」此前只能靠人读 yml，而这里有个**容易搞错的机制差异** ——
      # RequiredConfigChecker 用 @Value("${x:}") 带空默认值、只硬校验 3 项；
      # 其余 10 项是 application-prod.yml 里无默认占位符导致的启动失败。两套机制、别混成一个数。
      # 本步查四件事：① prod 要求的变量在 .env.example 都有**定义行**（否则运维不知道要配它）；
      # ② .env.example 里没有"代码根本不读"的幽灵变量；③ 留空的必须属"有意留空"白名单（每条带理由）；
      # ④ prod 里没开 dev-login / mock-wechat-pay 这两个致命开关。
      - name: 生产配置覆盖门禁
        run: node scripts/check-prod-config.js

      # 迁移清单门禁（2026-09-28 新增）：`sql/README.md` 是迁移清单的**正本**（AGENTS §4 指定），
      # 它一旦与 `sql/` 目录脱节，运维会在**改生产库**时做错决定：
      #   · 正向（文件有、README 没有）：脚本没有出处，分不清"废弃 / 一次性 / 我漏跑了"
      #     —— 运维文档自称「当前最可能踩的运维坑」就是它。实测曾有 **83 个 .sql 里 21 个无出处**，
      #     其中还包括 `clear_data.sql`（清全库）与 `reset_passwords.sql`（重置全部员工密码）两个最危险的。
      #   · 反向（README 指向不存在的文件）：照必跑清单执行时走到某行才发现文件不在，
      #     最坏是**跳过一个必跑的迁移还不自知**。
      - name: 迁移清单与 sql/ 目录一致性门禁
        run: node scripts/check-sql-catalog.js

      # 三处验证入口的门禁清单一致性（2026-09-28 新增）：ci.yml / verify.sh / verify-local.js
      # 是同一条事实的三份实现，漂移的形状是"新加门禁只接了其中一处"——
      # 那时另一个入口**永远不会告诉你它漏了**，表现为本仓记录过的「本机全绿、CI 红」且本地复现不出。
      # 本步解析三处文本（**剥掉注释与 echo 提示行**，否则"提示里提了一句"会被当成"这道门禁跑了"），
      # 逐道门禁比对；有意的不对称必须带理由登记在脚本的 KNOWN_ASYMMETRY 里。
      - name: 三处入口的门禁清单一致性
        run: node scripts/check-gate-parity.js

      # 「待拍板」标记的可追溯性（2026-09-28 新增）：AGENTS §0.6 是强制项 —— 改动取决于产品拍板时，
      # 当场要① 在代码/文档对应位置留「待拍板」标记、② 在文档清单登记（一处正本）、③ 回复里列出。
      # ⚠️ 上面这句**故意不写成标记的字面量**（写成字面量它自己就会被本步判成"悬着的决定没登记"——
      #    本文件是 .yml，属代码侧；这条注释接进来的当天就被门禁抓到过，是这道门禁真会叫的现场证据）。
      # 实测事故：退桶押金"钱怎么回到客户手上"只挂在小程序一行注释里，全仓文档查无此问。
      # 本步只判**代码侧**（每个标记必须指向真实存在的 docs/** 正本）；文档侧只列出来给人过
      #（`.md` 里的命中多半是"提及标记本身"的句子或历史审计记录，机械规则分不出使用与提及）。
      - name: 待拍板标记的可追溯性
        run: node scripts/check-pending-decisions.js

      # 端点契约对账（2026-09-28 新增）：controller 注解里的实路径 ↔ `docs/api/01-REST-API参考.md` 的登记，
      # **双向**都必须为空。两者是同一条事实的两处表述（同 `sql/README.md` ↔ `sql/` 那对），必然会漂：
      # 实测当天漂了 6 条（本轮新加的站间结算 4 条 + 押金交付 2 条），而文档是给运维/接手人看的契约 ——
      # 漏登记 ⇒ 新人不知道有这个能力（站间结算这种"钱"的能力尤其不能漏）；多登记 ⇒ 照它调用必然 404。
      # 校准后当前是 283 ↔ 283 零假阳性（解析坑：数组别名 `@RequestMapping({...})`、裸 `@GetMapping`）。
      - name: 端点契约与 API 参考一致性
        run: node scripts/check-api-doc.js

      # 场景测试矩阵门禁（2026-09-21 新增）。
      # 为什么需要它：docs/audit/2026-09-16-场景测试矩阵.md 是 AGENTS.md §5 指定的
      # 「新增用例前先看它找空白」入口，但它是一份**手写文档**，而测试类会被改名、合并、删除
      # —— 文档说「这条有断言」，人就会信；那个类其实没了，覆盖就是一个洞
      # （同 §8 第 14 条「被信任的文本比没有文本更危险」）。
      # 它查三件事：① 引用的测试类/方法必须真实存在；② 标 ✅ 的行必须指得出可核对的证据
      # （测试类/方法/脚本/报告，或显式写明「live 实测」）；③ 件数 STATS 块必须与本次实测一致。
      # ⚠️ 必须放在集成测试**之后**：③ 依赖 build/test-results/test/*.xml。
      - name: 场景测试矩阵一致性门禁
        run: python3 audit_scenario_matrix.py

      # 小程序「流程测试」（2026-09-25 新增，契约工作包 B/C；2026-09-26 增水票购买套件）。
      # 为什么静态扫描不够：它只能看出"页面里写没写 needConfirm"这样的字面量，
      # 而下单这批事故全是**流程错**——缺货当成功去付款、重试换键变成第二张单、
      # 把整个响应对象当订单号拼进 URL。只有真的执行处理函数、模拟 API 回调、
      # 断言"发了几次请求 / 用的哪个幂等键 / 跳去哪一页"才抓得住（见 tests/js/harness.js）。
      # ⚠️ 套件卡死（用例 await 的 Promise 永不 resolve）会让 Node 静默退出、退出码 0 ——
      # run-all.js 用 spawnSync 的超时兜住它，别改回 execFileSync。
      - name: 小程序流程测试（下单闭环 + 送达页 + 水票购买 + 公告草稿 + 弹窗文案）
        run: node tests/js/run-all.js

      - name: 敏感信息扫描（只报位置，不回显内容）
        run: bash scripts/scan-secrets.sh

      # 发布物检查（2026-09-27 新增）：**打出来的 jar 里不许有本地开发配置**。
      # 为什么必须单独一步：`application-local.yml` 被 .gitignore 忽略、也被 scan-secrets.sh
      # **显式排除**（那个脚本用 git grep，只看已跟踪的文本文件）—— 两道防线都不看它。
      # 而 src/main/resources/** 默认会被打进 BOOT-INF/classes/，实测旧 jar 里确实有它（7954 字节）。
      # ⚠️ 这一步要真的打个包，所以放在最后；build.gradle 的 bootJar 里另有一道同样的护栏
      #    （doLast 回读产物），两者互为独立检查 —— 一个管"构建时"，一个管"CI 里"。
      - name: 发布物检查（jar 里不许有本地配置）
        working-directory: AquaFlow-backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon --console=plain
          cd ..
          node scripts/check-jar-no-local-config.js

      # 生产启动姿态（2026-09-28 新增）：**拿上一步刚打出来的 jar 真起 13 次**，
      # 每次摘掉一个环境变量，看是"拒启"还是"能起"。
      # 为什么必须有：静态比对键名（上一条 check-prod-config.js）证明不了"真的会拒启"，
      # 也发现不了"声明了却没人读"的键 —— 实测就抓到过两处：
      #   · COS_SECRET_ID/KEY 原来无默认值 ⇒ 没配对象存储整个系统起不来（而代码本为它设计了优雅降级）；
      #   · COS_REGION/COS_BUCKET_NAME 没有任何代码读 ⇒ 声明成"缺失即失败"，实际根本不会失败。
      # 它自建/自清一次性库（aquaflow_prodstartup_check），只用上面已有的 mysql 服务，不需要额外资源。
      - name: 生产启动姿态（必需变量缺失必须拒启、COS 缺失只降级）
        run: node scripts/prod-startup-check.js

      - name: 上传测试报告（失败时也保留，便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: AquaFlow-backend/build/test-results/test/*.xml
          if-no-files-found: warn
