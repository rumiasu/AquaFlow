server:
  port: 8080

spring:
  application:
    name: AquaFlow
  datasource:
    url: jdbc:mysql://localhost:3306/aquaflow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Tokyo
    username: root
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.aquaflow.entity
  configuration:
    map-underscore-to-camel-case: true

wechat:
  miniapp:
    appid: ${JWT_SECRET:}
    secret: ${JWT_SECRET:}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry: 7200000
  refresh-token-expiry: 604800000