server:
  port: 8080

# 应用开关
app:
  # 开发模式登录开关：默认关闭（生产必须关闭，防止未授权获取角色 JWT）；开发需要时用环境变量 DEV_LOGIN_ENABLED=true 开启
  dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
  # P4-3: CORS 允许的来源列表（逗号分隔），生产环境必须配置实际域名
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}

spring:
  application:
    name: AquaFlow
  # 未显式指定 profile 时默认加载 local（读取 application-local.yml，内含本地密钥，已被 .gitignore 忽略）。
  # 生产部署请用 --spring.profiles.active=prod 并全部走环境变量注入。
  profiles:
    default: local
  datasource:
    # 注意：serverTimezone 必须为 Asia/Shanghai，此前误配为 Asia/Tokyo 导致时间比北京时间快 1 小时
    url: ${DB_URL:jdbc:mysql://localhost:3306/aquaflow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    # [AQ-044] 原为 non_null：null 字段会从 JSON 里静默消失（不是 null 而是键缺失），
    # 前端 res.data.data 变 undefined 后再 .length/.map 直接崩，且难以排查。
    # 改为 always：字段始终存在（值为 null），响应结构可预测；前端取值统一写 `res.data.data ?? fallback`。
    default-property-inclusion: always
    # [AQ-045] 时间统一序列化为 ISO-8601 字符串（本项目用 Jackson 3，日期时间默认即 ISO 字符串，
    # 不再输出时间戳数组，无需显式配置 write-dates-as-timestamps —— 该枚举在 Jackson 3 已移除）。
    # 前端约定：一律 new Date(str) 解析；禁止 .replace(/-/g,'/')（会把 ISO 的 '-' 也换掉导致 iOS 解析失败）。

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.aquaflow.entity
  configuration:
    map-underscore-to-camel-case: true
    # [AQ-047] 默认关闭 SQL 全量打印（StdOutImpl 会把 SQL 与参数打到 stdout，含手机号等敏感数据）。
    # 本地排查需要看 SQL 时，启动加环境变量 MYBATIS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

wechat:
  miniapp:
    # 安全基线：敏感配置一律不提供默认值，缺失时由 RequiredConfigChecker 在启动阶段失败退出。
    # 本地开发请通过环境变量或 application-local.yml 注入，切勿把真实密钥写回本文件。
    # 客户端小程序（miniapp-user，顾客）
    appid: ${WX_APP_ID:}
    secret: ${WX_APP_SECRET:}
    # 员工端小程序（miniapp-delivery，站长 + 配送员）——与客户端是**两个不同 appid**。
    # [2026-09-15] 缺失只 WARN 不阻塞启动（本地可用 dev-login）；但真机员工微信登录会不可用。
    staff-appid: ${WX_STAFF_APP_ID:}
    staff-secret: ${WX_STAFF_APP_SECRET:}

jwt:
  # JWT 签名密钥泄露 = 任何人可伪造任意身份的 token。必须外部注入，且长度 >= 32。
  secret: ${JWT_SECRET:}
  access-token-expiry: 7200000
  refresh-token-expiry: 604800000

cos:
  region: ${COS_REGION:ap-shanghai}
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  bucket-name: ${COS_BUCKET_NAME:aquaflow-prod-1474857078}
