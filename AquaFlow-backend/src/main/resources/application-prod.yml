# ============================================================
# application-prod.yml — 生产环境配置
#
# 启动命令: java -jar app.jar --spring.profiles.active=prod
#
# ⚠️ **哪些是真必需、哪些是可选，2026-09-28 用发布物 jar 逐个实测过**（13 个场景，
#    见 `__verify_prod_startup.py` 的输出）。这两类**机制不同**，别混：
#   · **必需（缺失即拒启）**：DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET /
#     WX_APP_ID / WX_APP_SECRET / WX_STAFF_APP_ID / WX_STAFF_APP_SECRET / CORS_ALLOWED_ORIGINS。
#     前 1 组与最后 1 项靠**占位符无默认值**（Spring 解析期就失败）；JWT/客户端微信那三项
#     另有一道 `RequiredConfigChecker`（JWT 还要求长度 ≥ 32）。
#   · **可选（缺失只降级，不阻断启动）**：COS 四件套。**这里必须给默认值** ——
#     第一版写的是 `${COS_SECRET_ID}`（无默认值），于是"没配对象存储"会让**整个水站系统起不来**，
#     而代码本来是为它设计了优雅降级的（`CosUtil.uploadFailureMessage` 有专门的"对象存储未配置"
#     文案、`RequiredConfigChecker` 对它只 WARN）。实测确认过：那时 COS_SECRET_ID/KEY 缺一项即拒启，
#     而 COS_REGION / COS_BUCKET_NAME 因为**没有任何代码读**反而"声明了也不会失败" —— 两头都不对。
# ============================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

wechat:
  miniapp:
    # 客户端小程序（顾客）
    appid: ${WX_APP_ID}
    secret: ${WX_APP_SECRET}
    # 员工端小程序（站长+配送员）。[2026-09-15] 本地(local)缺失只 WARN，
    # 但生产两端都是真实小程序，故这里**不给默认值**——缺失即启动失败（与本文件其它密钥一致）。
    staff-appid: ${WX_STAFF_APP_ID}
    staff-secret: ${WX_STAFF_APP_SECRET}

jwt:
  secret: ${JWT_SECRET}

# 对象存储：**可选**。四件套不齐时图片上传不可用（接口会回一句明确的"对象存储未配置"），
# 但订单/配送/桶账/水票/对账等全部功能照常 —— 别把它做成启动前置条件。
cos:
  region: ${COS_REGION:ap-shanghai}
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  bucket-name: ${COS_BUCKET_NAME:}

app:
  dev-login-enabled: false
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
