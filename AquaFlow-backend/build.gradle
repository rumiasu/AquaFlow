plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'AquaFlow'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// [F-63] 依赖锁定 + 供应链校验：仓库根 `gradle.lockfile` 与 `gradle/verification-metadata.xml`。
//
// 为什么：此前所有坐标（含 cos_api/jjwt/mybatis 的**传递**依赖）全浮动 —— 上游静默发版后，
// 同一提交在两个时点解析出不同构件，「本机绿、CI 红」分不清是代码坏了还是依赖变了；
// 且没有任何 checksum 门禁能拦"仓库被投毒"。
//
// 改依赖时的两个坑（都会**当场构建失败**，这是特性不是 bug）：
//   · 升/降任何版本后必须跑 `gradlew --write-locks`（否则 lock state 对不上，报 Did not resolve ...）；
//   · 引入新构件后必须跑 `gradlew --write-verification-metadata sha256`
//     （新构件无 checksum ⇒ Dependency verification failed）。
// 两个命令都会**整体重写**对应文件 —— 生成后 diff 一遍，别混进无关变更。
//
// 范围说明：只锁**本项目**的 configurations；settings/pluginManagement 侧的插件解析
// 不在 gradle.lockfile 里，但插件构件的 sha256 在 verification-metadata.xml 中有记。
dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // [F-64] 版本一律交给 Boot BOM 管（原钉 1.9.22 / 6.5.3 —— 与 BOM 里的版本各不相同，
    // 两处升级不同步时"以为受管、其实钉死"，这正是 F-64 登记的漂移形状）。
    // 仅限 **BOM 有管理**的坐标才允许不写版本号；BOM 不管的（jjwt / cos / bcprov / mybatis）必须继续钉死。
    implementation 'org.aspectj:aspectjweaver'
    // [F-64] 这行**不能删**（删了靠 BOM 补版本）：本仓是 Jackson 双栈共存 ——
    //   com.fasterxml.*（jackson-databind 本行 + 注解包）= 业务代码直接 new 的两个类
    //   （WeChatLoginService / StationExceptionConfigServiceImpl）；
    //   tools.jackson.* = Boot 4 框架 HTTP 层自用，仓库里 0 处显式引用。
    // 两侧版本各自由 Boot BOM / Spring Framework 自带，互不牵扯；**不要**顺手迁去 Jackson 3
    // （asText→asString 等 API 断裂，且落点是登录路径，风险/收益不划算 —— 见台账 F-64）。
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springframework.security:spring-security-crypto'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    // Tencent COS
    implementation 'com.qcloud:cos_api:5.6.227'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// [AQ-041] 开启 -parameters：让 AOP 能拿到方法参数名，从而校验 JSON body / 路径变量里的 stationId
// （原 RequireStationAspect 只读 query/form 参数，注解形同虚设）
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

/*
 * 发布物里**不许带** application-local.yml。
 *
 * 为什么：那个文件是本地开发配置（含真实 DB 口令等密钥），被 `.gitignore` 忽略、
 * 也被 `scripts/scan-secrets.sh` 排除 —— 也就是说**两道防线都不会看它**。
 * 而 `src/main/resources/**` 默认会被打进 `BOOT-INF/classes/`，实测（2026-09-27，44887868 字节的 jar）
 * 确实含 `BOOT-INF/classes/application-local.yml`（7954 字节，比 application.yml 还大）。
 * 结论：一旦把这个 jar 传到服务器/交给别人，密钥就跟着走了。
 *
 * ⚠️ **只排除 bootJar 里的那一份，不要写进 processResources**：
 * bootRun 与 test 用的都是 processResources 的输出目录（build/resources/main），
 * 在那里排除会让本地 `--spring.profiles.active=local` 直接起不来 ——
 * 等于为了堵一个发布漏洞把开发环境弄坏。bootJar 只是从该目录**再打包一次**，
 * 在打包这一步过滤，两边都保住。
 *
 * 判据：改完必须实测 `jar tf` 里没有它，且 `bootRun` 仍能起（见验收命令）。
 */
tasks.named('bootJar') {
    exclude 'application-local.yml'

    /*
     * 双重保险：打包后**再回读一次产物**，确认本地配置真的没进去。
     *
     * 为什么光有上面那行 `exclude` 不够：一个"从未失败过"的护栏等于没有护栏
     * （本仓对门禁的一贯要求是"摘掉它即红"）。将来若有人把 profile 文件改名
     * （application-dev.yml）、或换用别的打包方式，单条 exclude 会被绕过而无人察觉。
     * 这一步让"发布物带密钥"在 `gradlew bootJar` 当场就红，而不是等上线才发现。
     */
    doLast {
        def jarFile = archiveFile.get().asFile
        def forbidden = ['application-local.yml', 'application-local.yaml', 'application-local.properties',
                         'application-dev.yml', 'application-dev.yaml', 'application-dev.properties']
        def found = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { e ->
                if (forbidden.contains(new File(e.name).name)) {
                    found << e.name
                }
            }
        }
        if (!found.isEmpty()) {
            throw new GradleException(
                    "发布物里含本地/开发专用配置，禁止出包：${found}\n" +
                    "修法：确认 bootJar 的 exclude 规则覆盖了它们；" +
                    "且**不要**改到 processResources（bootRun 与 test 用的是它的输出目录）。")
        }
        logger.lifecycle("[bootJar] ✓ 发布物不含本地开发配置（${jarFile.name}）")
    }
}
