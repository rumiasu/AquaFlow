# =============================================================================
# 集成测试专用 profile（可安全提交：本文件不含任何密钥）。
#
# 依据改造执行任务书 Phase A.4 / Phase B：本机无 Docker，Testcontainers 不可用，
# 故采用任务书认可的降级方案 —— 使用「独立、可重建的测试库」aquaflow_test。
#
# 关键安全约定：
#   * 本文件只把数据源指向 aquaflow_test，绝不写死用户名/密码；
#     凭据由 local profile（application-local.yml，已 gitignore）继承。
#   * F-68（2026-10-02）：测试侧 spring.factories 在数据源 bean 创建前要求完整 IPv4 TCP
#     目标与库名确认（AQUAFLOW_ALLOW_TEST_DB_TARGET / AQUAFLOW_ALLOW_DB_RESET），根上下文冒烟也受保护。
#     AbstractIntegrationTest 清表前再次用同一实际连接核对 JDBC URL、catalog 与 SELECT DATABASE()；
#     原名称护栏保留为额外拒绝条件，库名像测试库并不等于允许清空。
#
# ⚠️ CI 上没有本文件所「继承」的那份配置：基类是 @ActiveProfiles({"local","test"})，
#    而 application-local.yml **只在开发机上存在**（已 gitignore）。凡是两处取值不同的
#    开关，都必须在下面 app: 段里显式钉死，否则会出现「本地绿、只在 CI 红」且本地复现不出。
#    用例需要打开某个开关时，请**自己**用 @TestPropertySource 声明（它的优先级高于本文件），
#    不要依赖本机的 application-local.yml（AGENTS §5 第三条 / skill §8.27）。
#
# 运行前置：先执行 scripts/provision-test-db.sh 重建 aquaflow_test（从 sql/schema.sql）。
# =============================================================================
spring:
  sql:
    init:
      # F-68：schema 由 provision-test-db.sh 准备；启动脚本可先于每例护栏执行 USE，故禁止自动初始化。
      # 测试 initializer 先拒绝再启用/脚本来源覆盖，再钉住 never；缺完整目标确认仍会拒绝启动。
      mode: never
  datasource:
    # TEST_DB_URL 须与 MYSQL_HOST/MYSQL_PORT/TEST_DB_NAME 和完整目标确认一致；仅支持严格的单 IPv4 TCP 子集。
    # 默认地址只供默认 aquaflow_test；直接运行自定义目标须显式给 TEST_DB_URL，不从库名猜地址。
    url: ${TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/aquaflow_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}

# 旧业务用例验证兼容路径；新模型场景用 @TestPropertySource 明确开启并走真实 HTTP。
aquaflow:
  barrel:
    independent-rights-enabled: false
    maintenance-enabled: false

# 登录类端点限流在整套集成测试里默认关闭：
#   ① 所有用例都从 127.0.0.1 发请求，共享同一个计数器，开着会让"跑全量顺序不同 → 结果不同"；
#   ② 验证限流本身的那个用例用 @TestPropertySource 单独把开关打开，并把阈值调到 3。
app:
  # ── 配置差集：逐条钉死（2026-09-30，F-15）─────────────────────────────────────────
  # 口径：**只钉「本地与 CI 取值不同」的开关**。当前全部差集就是下面三个 ——
  #   ① app.dev-login-enabled       本地 true（application-local.yml）/ CI false（application.yml 默认）
  #   ② app.rate-limit.enabled      本地 false                    / 默认 true
  #   ③ app.payment.mock-wechat-pay 本地 true                     / 默认 false
  # 其余 app.* 键两处同值，不再重复钉（钉下来只会多出第二份要维护的"默认值"）。
  # 不钉 ① 的后果本仓已踩过一次：任何「本地靠 dev-login 换到 token、自己又没声明属性」的
  # 用例都会**只在 CI 红**，本地复现不出 —— CI 那边 DEV_LOGIN_ENABLED=false，且没有
  # application-local.yml。它改变的还有 DevLoginController 的 @ConditionalOnProperty：
  # 为 false 时该 Bean 根本不存在，/api/auth/dev-login 是 404，而不是"存在但拒绝"。
  # ⚠️ 要打开某个开关的用例**请自己用 @TestPropertySource 声明**（它的优先级高于本文件，
  #    不会被这一行钉死）—— 唯一使用 dev-login 的 DeliveryConsoleAndSelfServiceIntegrationTest
  #    就是这么做的；不要把本机那份不入库的 application-local.yml 当依赖（AGENTS §5 第三条）。
  dev-login-enabled: false

  rate-limit:
    enabled: false
    public-enabled: false

  # [2026-09-20] 集成测试一律按**真实口径**跑：微信渠道未接入。
  #
  # 为什么必须显式写这一行：真机联调会在 application-local.yml 里把
  # app.payment.mock-wechat-pay 打开，而集成测试也带 local profile
  # （AbstractIntegrationTest 是 @ActiveProfiles({"local","test"})，后写的 test 覆盖 local）——
  # 不覆盖的话，本机跑测试会整个跑成"模拟渠道"版本：微信单一律当场变已付款，于是
  # PaidBeforeDispatch / PaymentRefundOriginalRoute / UnpaidWechatOrderTimeout 三个类的
  # 既有断言集体变红（实测 20 例里红 5 例），而 CI 上（没有 application-local.yml）却是绿的。
  # 这正是 AGENTS §5 第三条的教训：**用例依赖什么就自己声明什么**，别继承开发机的配置。
  # 要测模拟渠道的用例自己加 @TestPropertySource 打开（见 MockWechatPayIntegrationTest）。
  payment:
    mock-wechat-pay: false
