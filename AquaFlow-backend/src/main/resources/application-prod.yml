# ============================================================
# application-prod.yml — 生产环境配置
#
# 启动命令: java -jar app.jar --spring.profiles.active=prod
#
# ⚠️ **哪些是真必需、哪些是可选，2026-09-28 用发布物 jar 逐个实测过**（13 个场景，
#    见 `__verify_prod_startup.py` 的输出）。这两类**机制不同**，别混：
#   · **必需（缺失即拒启）**：DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET /
#     WX_APP_ID / WX_APP_SECRET / WX_STAFF_APP_ID / WX_STAFF_APP_SECRET / CORS_ALLOWED_ORIGINS。
#     ⚠️ 本文件的 `${X}`（无默认值）只对**启动期有人读的键**（JWT/微信/CORS → 解析期就失败）有效；
#     数据源三件**启动期本没人读**（Hikari 懒初始化 —— 2026-09-30 实测摘掉 DB_URL 服务照样起来、
#     连接池首个查库请求才建立），由 `RequiredConfigChecker#checkProdDatasource()` **显式读一次兜底**
#     （2026-09-30 拍板 A）。改本文件的占位符 ≠ 有护栏，护栏在那个类里。
#     JWT 另有一道 `RequiredConfigChecker`（JWT 还要求长度 ≥ 32）。
#   · **可选（缺失只降级，不阻断启动）**：COS 四件套。**这里必须给默认值** ——
#     第一版写的是 `${COS_SECRET_ID}`（无默认值），于是"没配对象存储"会让**整个水站系统起不来**，
#     而代码本来是为它设计了优雅降级的（`CosUtil.uploadFailureMessage` 有专门的"对象存储未配置"
#     文案、`RequiredConfigChecker` 对它只 WARN）。实测确认过：那时 COS_SECRET_ID/KEY 缺一项即拒启，
#     而 COS_REGION / COS_BUCKET_NAME 因为**没有任何代码读**反而"声明了也不会失败" —— 两头都不对。
# ============================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

wechat:
  miniapp:
    # 客户端小程序（顾客）
    appid: ${WX_APP_ID}
    secret: ${WX_APP_SECRET}
    # 员工端小程序（站长+配送员）。[2026-09-15] 本地(local)缺失只 WARN，
    # 但生产两端都是真实小程序，故这里**不给默认值**——缺失即启动失败（与本文件其它密钥一致）。
    staff-appid: ${WX_STAFF_APP_ID}
    staff-secret: ${WX_STAFF_APP_SECRET}

jwt:
  secret: ${JWT_SECRET}

# 对象存储：**可选**。四件套不齐时图片上传不可用（接口会回一句明确的"对象存储未配置"），
# 但订单/配送/桶账/水票/对账等全部功能照常 —— 别把它做成启动前置条件。
cos:
  region: ${COS_REGION:ap-shanghai}
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  bucket-name: ${COS_BUCKET_NAME:}

app:
  # [F-06 2026-09-30] 生产后门开关：dev-login 必须字面 false。
  # ⚠️ 写在这里**不是**闸 —— 命令行参数（--app.dev-login-enabled=true）/ SPRING_APPLICATION_JSON /
  #    直接映射的环境变量（APP_DEV_LOGIN_ENABLED）优先级都高于配置文件，照样能覆盖它。
  #    真正的闸是启动期硬校验 `config/RequiredConfigChecker#checkProdSafetySwitches`：
  #    prod profile 生效时，只要解析出的 app.dev-login-enabled 或 app.payment.mock-wechat-pay 为 true，
  #    直接 `IllegalStateException` 拒绝启动（与"缺变量"那套 Spring 解析期失败是两回事）。
  dev-login-enabled: false
  # ⚠️ `app.payment.mock-wechat-pay` **故意不写在本文件**：它由 `application.yml` 的
  #    `${MOCK_WECHAT_PAY:false}` 提供，闸同样只有上面那道启动期硬校验。
  #    若在这里写死 false，`MOCK_WECHAT_PAY=true` 会被配置层静默覆盖 —— 看着"有闸"，
  #    实则那道校验再也不会触发（F-06 的验收场景随之失效）。要收紧就改 Checker，别改这里。
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
